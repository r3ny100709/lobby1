<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Rainy.Ren</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">

<style>

/* =========================
   ตัวแปร
========================= */

:root{
  box-sizing:border-box;

  --ink:#c2547a;
  --soft:#ffb8d0;
  --line:#f3c4d4;

  --card:rgba(255,255,255,.72);
}


/* =========================
   พื้นหลัง
========================= */

html,
body{
  margin:0;
  min-height:100%;
}

body{
  overflow-x:hidden;

  background:#000000;

  font-family:
    'Mali',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  color:var(--ink);
}


/* =========================
   พื้นที่ดาวตก
========================= */

#sky{
  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:0;
}


/* =========================
   ดาวตก
========================= */

.meteor{
  position:absolute;

  top:-80px;

  width:2px;
  height:75px;

  border-radius:50%;

  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(255,255,255,.45),
    rgba(255,255,255,.95),
    #ffffff
  );

  filter:
    drop-shadow(
      0 0 4px
      rgba(255,255,255,.9)
    )
    drop-shadow(
      0 0 10px
      rgba(255,255,255,.5)
    );

  animation:
    meteorFall
    linear
    forwards;
}


@keyframes meteorFall{

  0%{
    transform:
      translate(0,0)
      rotate(25deg);

    opacity:0;
  }

  10%{
    opacity:1;
  }

  75%{
    opacity:1;
  }

  100%{
    transform:
      translate(220px,115vh)
      rotate(25deg);

    opacity:0;
  }

}


/* =========================
   เนื้อหาหลัก
========================= */

.stage{
  position:relative;

  z-index:1;

  text-align:center;

  padding:
    22px
    18px
    40px;

  max-width:520px;

  margin:0 auto;
}


/* =========================
   กรอบคลิป
========================= */

.video-box{

  width:58%;

  max-width:250px;

  margin:
    4px auto
    14px;

  padding:5px;

  background:rgba(255,255,255,.06);

  border:
    2px solid
    rgba(255,184,208,.85);

  border-radius:24px;

  box-shadow:
    0 0 12px
    rgba(255,184,208,.28),

    0 0 30px
    rgba(255,150,190,.12);

  overflow:hidden;

  box-sizing:border-box;

}


/* ตัวคลิป */

.video-box video{

  display:block;

  width:100%;

  height:auto;

  max-height:250px;

  object-fit:cover;

  border-radius:18px;

}


/* =========================
   ชื่อ
========================= */

h1{

  margin:
    8px 0 4px;

  font-size:
    clamp(
      1.5rem,
      6vw,
      2.2rem
    );

  font-weight:700;

  color:#ffffff;

  text-shadow:
    0 0 8px
    rgba(255,255,255,.35),

    0 0 18px
    rgba(255,182,210,.25);

}


/* =========================
   เมนู
========================= */

.menu{

  display:flex;

  flex-direction:column;

  gap:16px;

  margin-top:22px;

}


/* =========================
   กล่องเมนู
========================= */

.card{

  position:relative;

  background:var(--card);

  border:
    3px solid
    var(--soft);

  outline:
    3px dotted
    var(--line);

  outline-offset:4px;

  border-radius:28px;

  padding:
    18px 20px;

  box-shadow:
    0 8px 20px
    rgba(255,150,190,.25);

  text-align:left;

  transition:
    transform .2s,
    box-shadow .2s;

  cursor:pointer;

}


.card:hover,
.card:active{

  transform:
    translateY(-4px)
    scale(1.01);

  box-shadow:
    0 12px 26px
    rgba(255,150,190,.4);

}


/* =========================
   ไอคอนวงกลม
========================= */

.card .tag{

  position:absolute;

  top:-16px;

  right:18px;

  font-size:26px;

  background:#000000;

  border:
    3px solid
    var(--soft);

  border-radius:50%;

  width:42px;
  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

}


/* =========================
   ตัวหนังสือเมนู
========================= */

.card h2{

  margin:0;

  font-size:1.5rem;

  font-weight:700;

  color:var(--ink);

}


/* =========================
   ลิงก์
========================= */

.card-link{

  display:block;

  text-decoration:none;

  color:inherit;

}


/* =========================
   Game
========================= */

.card.game{

  padding:
    26px 22px;

  text-align:center;

}


.card.game h2{

  font-size:
    clamp(
      3rem,
      16vw,
      4.6rem
    );

  line-height:1;

  letter-spacing:2px;

}


/* =========================
   ลด Animation
========================= */

@media (prefers-reduced-motion:reduce){

  *{
    animation:none !important;
  }

}

</style>
</head>


<body>


<!-- =========================
     พื้นที่ดาวตก
========================= -->

<div id="sky"></div>


<!-- =========================
     เนื้อหาหลัก
========================= -->

<main class="stage">


  <!-- =======================
       คลิปด้านบน
  ======================== -->

  <div class="video-box">

    <video
      src="snaptik_7658649579251977493_v3.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>

  </div>


  <!-- =======================
       ชื่อ
  ======================== -->

  <h1>
    Rainy.Ren
  </h1>


  <!-- =======================
       เมนู
  ======================== -->

  <div class="menu">


    <!-- Game -->

    <section class="card game">

      <span class="tag">
        🎮
      </span>

      <h2>
        Game
      </h2>

    </section>


    <!-- About me -->

    <section class="card">

      <span class="tag">
        🌷
      </span>

      <h2>
        About me
      </h2>

    </section>


    <!-- History -->

    <a
      class="card card-link"
      href="https://r3ny100709.github.io/history/"
    >

      <span class="tag">
        📖
      </span>

      <h2>
        History
      </h2>

    </a>


    <!-- Setting -->

    <section class="card">

      <span class="tag">
        ⚙️
      </span>

      <h2>
        Setting
      </h2>

    </section>


  </div>

</main>


<script>

/* =========================
   พื้นที่ดาวตก
========================= */

const sky =
  document.getElementById('sky');


/* =========================
   สร้างดาวตก
========================= */

function spawnMeteor(){

  const el =
    document.createElement('span');

  el.className =
    'meteor';


  /* จุดเริ่มต้นแบบสุ่ม */

  el.style.left =
    Math.random() * 100 + 'vw';


  /* ความเร็วแบบสุ่ม */

  el.style.animationDuration =
    2 + Math.random() * 2 + 's';


  /* ความสว่างแบบสุ่ม */

  el.style.opacity =
    0.5 + Math.random() * 0.5;


  /* มุมดาวตกแบบสุ่ม */

  el.style.transform =
    `rotate(
      ${20 + Math.random() * 20}deg
    )`;


  /* เพิ่มดาวลงบนหน้าจอ */

  sky.appendChild(el);


  /* ลบดาวหลังจากตกเสร็จ */

  setTimeout(
    () => el.remove(),
    5000
  );

}


/* =========================
   ดาวตกต่อเนื่อง
========================= */

setInterval(
  spawnMeteor,
  450
);


/* =========================
   สร้างดาวชุดแรกทันที
========================= */

for(let i = 0; i < 8; i++){

  setTimeout(
    spawnMeteor,
    i * 180
  );

}

</script>


</body>
</html>
