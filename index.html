<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Fantasy Lobby</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #a0e7ff;
      --blue-light: #e6f8ff;
      --pink: #ffb8d6;
      --pink-light: #ffe6f2;
      --white: #fffdfd;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       9:16 CONTAINER LOCK
    ========================= */

    .screen-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px; /* จำกัดความกว้างไม่ให้เกินสัดส่วนมือถือแนวตั้ง */
      max-height: 900px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #0d131f;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
    }

    @media (min-width: 451px) {
      .screen-container {
        border: 2px solid rgba(255, 184, 214, 0.2);
      }
    }

    /* =========================
       MAIN LOBBY
    ========================= */

    .lobby {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(15, 23, 38, 0.35),
          rgba(10, 15, 26, 0.75)
        ),
        url("city-background.jpg") center / cover no-repeat;

      isolation: isolate;
    }

    .lobby::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          circle at 15% 30%,
          rgba(160, 231, 255, 0.2),
          transparent 40%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255, 184, 214, 0.2),
          transparent 40%
        );
      
      pointer-events: none;
    }

    /* =========================
       DECORATIVE UI CORNERS
    ========================= */

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: rgba(255, 184, 214, 0.5);
      pointer-events: none;
      z-index: 5;
    }

    .corner.top-left { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; border-radius: 6px 0 0 0; }
    .corner.top-right { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; border-radius: 0 6px 0 0; }
    .corner.bottom-left { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; border-radius: 0 0 0 6px; }
    .corner.bottom-right { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 6px 0; }

    /* =========================
       TOP CLOCK
    ========================= */

    .clock {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);

      min-width: 130px;
      padding: 6px 18px;
      text-align: center;

      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 184, 214, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(255, 184, 214, 0.15);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .clock span {
      display: block;
      font-family: "Orbitron", sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--blue-light);
      text-shadow: 0 0 8px rgba(160, 231, 255, 0.6);
    }

    /* =========================
       MAIN UI PANELS
    ========================= */

    .ui {
      position: absolute;
      inset: 0;
      padding: 75px 16px 85px;
      pointer-events: none;
      z-index: 8;
    }

    .panel {
      pointer-events: auto;
      position: absolute;

      background: linear-gradient(
        135deg,
        rgba(26, 38, 57, 0.85),
        rgba(15, 23, 38, 0.8)
      );

      border: 1px solid rgba(255, 184, 214, 0.35);
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .panel:hover {
      border-color: rgba(255, 184, 214, 0.7);
    }

    .panel-title {
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--pink);
      margin-bottom: 6px;
      text-shadow: 0 0 6px rgba(255, 184, 214, 0.4);
    }

    /* UPDATE PANEL */
    .update-panel {
      left: 16px;
      top: 110px;
      width: 135px;
      height: 180px;
      padding: 14px 12px;
    }

    .update-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 184, 214, 0.4), transparent);
      margin: 8px 0;
    }

    .locked {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: rgba(240, 245, 255, 0.75);
      font-weight: 500;
    }

    .status {
      padding: 2px 5px;
      border: 1px solid rgba(255, 184, 214, 0.5);
      border-radius: 5px;
      color: var(--pink);
      font-size: 7px;
      letter-spacing: 1px;
      background: rgba(255, 184, 214, 0.1);
    }

    /* RIGHT PANELS */
    .game-panel {
      right: 16px;
      top: 110px;
      width: 140px;
      height: 105px;
      padding: 14px 12px;
    }

    .me-panel {
      right: 16px;
      top: 225px;
      width: 140px;
      height: 115px;
      padding: 14px 12px;
    }

    .empty {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(160, 231, 255, 0.25);
      border-radius: 6px;
      color: rgba(225, 242, 250, 0.4);
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* =========================
       CHARACTER & ANIMATION
    ========================= */

    .character-area {
      position: absolute;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      width: 240px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .character {
      width: 210px;
      height: 360px;
      
      /* รูปตัวละครอนิเมะสาวผมเงินที่คุณส่งมา */
      background-image: url("https://i.ibb.co/1GzR17r0/image-6.png"); /* อัปเดตลิงก์รูปภาพตัวละครของคุณที่นี่ */
      
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;

      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      animation: floatChar 4s ease-in-out infinite;
    }

    .character:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    @keyframes floatChar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* =========================
       SPEECH BUBBLE
    ========================= */

    .speech {
      position: absolute;
      left: 50%;
      bottom: 430px;
      width: 185px;
      padding: 10px 14px;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      visibility: hidden;

      background: rgba(255, 240, 246, 0.95);
      color: #3b2b35;
      border: 1px solid rgba(255, 184, 214, 0.9);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    .speech.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .speech-text {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 12px;
      height: 12px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(255, 240, 246, 0.95);
      border-right: 1px solid rgba(255, 184, 214, 0.9);
      border-bottom: 1px solid rgba(255, 184, 214, 0.9);
    }

    /* =========================
       BOTTOM MENU
    ========================= */

    .bottom-menu {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 15;
      width: 92%;
      justify-content: space-between;
    }

    .menu-button {
      flex: 1;
      height: 40px;
      padding: 0 4px;

      border: 1px solid rgba(255, 184, 214, 0.4);
      border-radius: 10px;
      background: rgba(25, 35, 52, 0.85);
      color: rgba(240, 245, 255, 0.9);

      font-family: "Quicksand", sans-serif;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    .menu-button:hover {
      background: rgba(255, 184, 214, 0.2);
      border-color: var(--pink);
      transform: translateY(-2px);
    }

    /* ปุ่ม START ขนาดใหญ่เป็นพิเศษ สะใจเด่นชัด */
    .menu-button.start {
      flex: 1.6; /* ขยายสัดส่วนให้กว้างกว่าปุ่มอื่น */
      height: 46px; /* สูงกว่าปุ่มอื่น */
      color: #1a1e29;
      background: linear-gradient(135deg, var(--blue-light), var(--blue));
      border: 2px solid rgba(255, 255, 255, 0.95);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(160, 231, 255, 0.5);
    }

    .menu-button.start:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 22px rgba(160, 231, 255, 0.7);
    }

    /* =========================
       INSTAGRAM CREDIT
    ========================= */

    .credit {
      position: absolute;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      font-family: "Orbitron", sans-serif;
      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(230, 247, 255, 0.6);
      white-space: nowrap;
      z-index: 10;
    }

    .credit a {
      color: var(--pink);
      text-decoration: none;
      text-shadow: 0 0 6px rgba(255, 188, 218, 0.6);
    }

    .credit a:hover {
      color: var(--blue);
    }
  </style>
</head>

<body>

  <div class="screen-container">
    <main class="lobby">

      <!-- Decorative corners -->
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>

      <!-- REAL-TIME CLOCK -->
      <div class="clock">
        <span id="clock">00:00</span>
      </div>

      <section class="ui">
        <!-- UPDATE -->
        <div class="panel update-panel">
          <div class="panel-content">
            <div class="panel-title">UPDATE</div>
            <div class="update-line"></div>
            <div class="locked"><span>UPDATE 01</span><span class="status">LOCKED</span></div>
            <div class="update-line"></div>
            <div class="locked"><span>UPDATE 02</span><span class="status">LOCKED</span></div>
            <div class="update-line"></div>
            <div class="locked"><span>UPDATE 03</span><span class="status">LOCKED</span></div>
          </div>
        </div>

        <!-- ABOUT GAME -->
        <div class="panel game-panel">
          <div class="panel-content">
            <div class="panel-title">ABOUT GAME</div>
            <div class="empty">COMING SOON</div>
          </div>
        </div>

        <!-- ABOUT ME -->
        <div class="panel me-panel">
          <div class="panel-content">
            <div class="panel-title">ABOUT ME</div>
            <div class="empty">PROFILE</div>
          </div>
        </div>
      </section>

      <!-- CHARACTER -->
      <div class="character-area">
        <div class="character" id="character" title="Click me!"></div>
      </div>

      <!-- SPEECH -->
      <div class="speech" id="speech">
        <div class="speech-text" id="speechText"></div>
      </div>

      <!-- INSTAGRAM -->
      <div class="credit">
        <a href="https://www.instagram.com/kllurself.ut/" target="_blank" rel="noopener noreferrer">
          IG: kllurself.ut
        </a>
      </div>

      <!-- BOTTOM MENU -->
      <nav class="bottom-menu">
        <button class="menu-button">About me</button>
        <button class="menu-button">ประวัติเกม</button>
        <button class="menu-button start">START</button>
        <button class="menu-button">Update</button>
        <button class="menu-button">Setting</button>
      </nav>

    </main>
  </div>

  <script>
    /* =========================
       REAL-TIME CLOCK
    ========================= */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* =========================
       CHARACTER SPEECH (JAPANESE)
    ========================= */
    const character = document.getElementById("character");
    const speech = document.getElementById("speech");
    const speechText = document.getElementById("speechText");

    const japaneseLines = [
      "こんにちは！",
      "一緒に遊ぼう？",
      "ようこそ！",
      "ゲームを始める？",
      "ここで待ってるね。",
      "今日も頑張ろう！"
    ];

    character.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * japaneseLines.length);
      speechText.textContent = japaneseLines[randomIndex];
      speech.classList.add("show");

      clearTimeout(window.speechTimer);
      window.speechTimer = setTimeout(() => {
        speech.classList.remove("show");
      }, 3000);
    });
  </script>

</body>
</html>
