<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Fantasy Lobby</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #9bdcff;
      --blue-light: #d9f4ff;
      --blue-dark: #274b68;
      --pink: #ffc9df;
      --pink-light: #ffe8f1;
      --white: #f7fcff;
      --glass: rgba(15, 29, 43, 0.58);
      --line: rgba(180, 231, 255, 0.55);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Quicksand", sans-serif;
      color: var(--white);
      background: #111923;
    }

    /* =========================
       MAIN LOBBY
    ========================= */

    .lobby {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 600px;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(9, 20, 32, 0.35),
          rgba(7, 16, 27, 0.72)
        ),
        url("city-background.jpg") center / cover no-repeat;

      isolation: isolate;
    }

    /* Fantasy blue glow */

    .lobby::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          circle at 18% 35%,
          rgba(142, 221, 255, 0.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 82% 25%,
          rgba(255, 184, 219, 0.18),
          transparent 32%
        );
      
      pointer-events: none;
    }

    /* =========================
       DECORATIVE UI LINES
    ========================= */

    .corner {
      position: absolute;
      width: 55px;
      height: 55px;
      border-color: rgba(183, 232, 255, 0.7);
      pointer-events: none;
    }

    .corner.top-left {
      top: 15px;
      left: 15px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .corner.top-right {
      top: 15px;
      right: 15px;
      border-top: 1px solid;
      border-right: 1px solid;
    }

    .corner.bottom-left {
      bottom: 15px;
      left: 15px;
      border-bottom: 1px solid;
      border-left: 1px solid;
    }

    .corner.bottom-right {
      bottom: 15px;
      right: 15px;
      border-bottom: 1px solid;
      border-right: 1px solid;
    }

    /* =========================
       TOP CLOCK
    ========================= */

    .clock {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) skewX(-8deg);

      min-width: 145px;
      padding: 9px 20px;

      text-align: center;

      background: rgba(20, 40, 55, 0.65);
      border: 1px solid var(--line);

      box-shadow:
        0 0 18px rgba(133, 220, 255, 0.2),
        inset 0 0 15px rgba(141, 221, 255, 0.05);

      backdrop-filter: blur(8px);
    }

    .clock span {
      display: block;
      transform: skewX(8deg);

      font-family: "Orbitron", sans-serif;
      font-size: 17px;
      letter-spacing: 2px;
      color: var(--blue-light);

      text-shadow: 0 0 10px rgba(151, 224, 255, 0.7);
    }

    /* =========================
       MAIN UI
    ========================= */

    .ui {
      position: absolute;
      inset: 0;
      padding: 85px 18px 78px;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;

      position: absolute;

      background:
        linear-gradient(
          135deg,
          rgba(21, 43, 60, 0.78),
          rgba(10, 22, 34, 0.62)
        );

      border: 1px solid rgba(181, 230, 255, 0.55);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.28),
        inset 0 0 22px rgba(145, 220, 255, 0.04);

      backdrop-filter: blur(10px);

      transform: skewX(-7deg);
    }

    .panel-content {
      transform: skewX(7deg);
    }

    .panel-title {
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--blue-light);
      margin-bottom: 8px;
    }

    /* =========================
       LEFT UPDATE
    ========================= */

    .update-panel {
      left: 18px;
      top: 125px;

      width: 145px;
      height: 190px;

      padding: 18px 14px;
    }

    .update-line {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(171, 227, 255, 0.55),
        transparent
      );

      margin: 12px 0;
    }

    .locked {
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 10px;
      color: rgba(238, 249, 255, 0.65);
    }

    .status {
      padding: 3px 6px;

      border: 1px solid rgba(255, 201, 223, 0.45);

      color: var(--pink);
      font-size: 8px;
      letter-spacing: 1px;

      background: rgba(255, 187, 218, 0.08);
    }

    /* =========================
       RIGHT PANELS
    ========================= */

    .game-panel {
      right: 18px;
      top: 125px;

      width: 155px;
      height: 115px;

      padding: 17px 14px;
    }

    .me-panel {
      right: 18px;
      top: 255px;

      width: 155px;
      height: 125px;

      padding: 17px 14px;
    }

    /* =========================
       EMPTY CONTENT
       ========================= */

    .empty {
      width: 100%;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px dashed rgba(180, 225, 245, 0.2);

      color: rgba(225, 242, 250, 0.32);
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* =========================
       CHARACTER PLACEHOLDER
    ========================= */

    .character-area {
      position: absolute;

      left: 50%;
      bottom: 82px;

      transform: translateX(-50%);

      width: 190px;
      height: 260px;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      pointer-events: none;
    }

    /*
      ใส่รูปตัวละครภายหลังตรงนี้:

      .character {
        background-image: url("character.png");
      }
    */

    .character {
      width: 150px;
      height: 235px;

      opacity: 0;

      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;

      pointer-events: auto;
      cursor: pointer;
    }

    /* =========================
       SPEECH BUBBLE
    ========================= */

    .speech {
      position: absolute;

      left: 50%;
      bottom: 350px;

      width: 185px;

      padding: 12px 15px;

      transform:
        translateX(-50%)
        skewX(-5deg)
        scale(0.85);

      opacity: 0;
      visibility: hidden;

      background: rgba(240, 250, 255, 0.92);
      color: #314858;

      border: 1px solid rgba(155, 220, 255, 0.8);

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.25),
        0 0 15px rgba(158, 222, 255, 0.25);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .speech.show {
      opacity: 1;
      visibility: visible;

      transform:
        translateX(-50%)
        skewX(-5deg)
        scale(1);
    }

    .speech-text {
      transform: skewX(5deg);

      text-align: center;

      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
    }

    .speech::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -9px;

      width: 16px;
      height: 16px;

      transform: translateX(-50%) rotate(45deg);

      background: rgba(240, 250, 255, 0.92);

      border-right: 1px solid rgba(155, 220, 255, 0.8);
      border-bottom: 1px solid rgba(155, 220, 255, 0.8);
    }

    /* =========================
       BOTTOM MENU
    ========================= */

    .bottom-menu {
      position: absolute;

      left: 50%;
      bottom: 49px;

      transform: translateX(-50%);

      display: flex;
      gap: 8px;

      z-index: 10;
    }

    .menu-button {
      min-width: 72px;
      height: 34px;

      padding: 0 12px;

      border: 1px solid rgba(176, 226, 249, 0.5);

      background: rgba(16, 31, 44, 0.72);

      color: rgba(238, 249, 255, 0.88);

      font-family: "Quicksand", sans-serif;
      font-size: 10px;
      font-weight: 600;

      cursor: pointer;

      transform: skewX(-8deg);

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .menu-button span {
      display: block;
      transform: skewX(8deg);
    }

    .menu-button:hover {
      background: rgba(124, 201, 237, 0.18);
      border-color: var(--blue);
      transform: skewX(-8deg) translateY(-2px);
    }

    .menu-button.start {
      color: #263d4b;

      background:
        linear-gradient(
          135deg,
          var(--blue-light),
          var(--blue)
        );

      border-color: rgba(220, 248, 255, 0.9);

      box-shadow:
        0 0 18px rgba(141, 220, 255, 0.25);
    }

    /* =========================
       INSTAGRAM
    ========================= */

    .credit {
      position: absolute;

      left: 50%;
      bottom: 14px;

      transform: translateX(-50%);

      font-family: "Orbitron", sans-serif;
      font-size: 9px;
      letter-spacing: 1px;

      color: rgba(230, 247, 255, 0.65);

      white-space: nowrap;
    }

    .credit a {
      color: var(--pink);
      text-decoration: none;

      text-shadow:
        0 0 8px rgba(255, 188, 218, 0.5);
    }

    /* =========================
       RESPONSIVE 9:16
    ========================= */

    @media (max-width: 430px) {

      .update-panel {
        left: 12px;
        width: 128px;
        height: 175px;
      }

      .game-panel,
      .me-panel {
        right: 12px;
        width: 135px;
      }

      .game-panel {
        height: 105px;
      }

      .me-panel {
        top: 240px;
        height: 115px;
      }

      .character-area {
        width: 165px;
        height: 235px;
        bottom: 85px;
      }

      .character {
        width: 140px;
        height: 220px;
      }

      .speech {
        bottom: 325px;
        width: 165px;
      }

      .bottom-menu {
        gap: 4px;
      }

      .menu-button {
        min-width: 60px;
        padding: 0 8px;
        font-size: 9px;
      }
    }

    /* =========================
       TALL SCREEN
    ========================= */

    @media (min-height: 850px) {

      .character-area {
        bottom: 92px;
        height: 320px;
      }

      .character {
        height: 290px;
      }

      .speech {
        bottom: 410px;
      }
    }
  </style>
</head>

<body>

  <main class="lobby">

    <!-- Decorative corners -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- REAL-TIME CLOCK -->
    <div class="clock">
      <span id="clock">00:00</span>

    <section class="ui">

      <div class="panel update-panel">

          <div class="panel-title">UPDATE</div>

          <div class="update-line"></div>

          <div class="locked">

      </div>

      <!-- ABOUT GAME -->
      <div class="panel game-panel">
        <div class="panel-content">
          <div class="panel-title">ABOUT GAME</div>

          <div class="empty"></div>
        </div>
      </div>

      <!-- ABOUT ME -->
      <div class="panel me-panel">
        <div class="panel-content">
          <div class="panel-title">ABOUT ME</div>

          <div class="empty"></div>
        </div>
      </div>

    </section>

    <!-- CHARACTER -->
    <div class="character-area">

      <div
        class="character"
        id="character"
        title="Click"
      ></div>

    </div>

    <!-- SPEECH -->
    <div class="speech" id="speech">
      <div class="speech-text" id="speechText"></div>
    </div>

    <!-- BOTTOM MENU -->
    <nav class="bottom-menu">

      <button class="menu-button">
        <span>About me</span>
      </button>

      <button class="menu-button">
        <span>ประวัติเกม</span>
      </button>

      <button class="menu-button">

      </button>

      <button class="menu-button start">

      </button>

      <button class="menu-button">
        <span>Setting</span>
      </button>

    </nav>

    <!-- INSTAGRAM -->
    <div class="credit">
      <a
        href="https://www.instagram.com/kllurself.ut/"
        target="_blank"
        rel="noopener noreferrer"
      >
        IG: kllurself.ut
      </a>
    </div>

  </main>

    ========================= */

    function updateClock() {

      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");

      document.getElementById("clock").textContent =
        `${hours}:${minutes}`;
    }

    updateClock();

    setInterval(updateClock, 1000);


    /* =========================

    ========================= */

    ];

    character.addEventListener("click", () => {

        Math.floor(Math.random() * japaneseLines.length);

        japaneseLines[randomIndex];

      speech.classList.add("show");

      clearTimeout(window.speechTimer);

      window.speechTimer = setTimeout(() => {
        speech.classList.remove("show");

    });

    /* =========================

    });

  </script>

</body>
</html
