<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fantasy Lobby</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --cyan: #83eaff;
    --blue: #5caeff;
    --deep-blue: #182e54;
    --glass: rgba(8, 16, 30, 0.68);
    --line: rgba(150, 225, 255, 0.55);
    --white: #edfaff;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050a12;
    font-family: 'Rajdhani', 'Noto Sans Thai', sans-serif;
    color: var(--white);
}

body {
    position: relative;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background:
        linear-gradient(
            90deg,
            rgba(3, 8, 16, 0.72) 0%,
            rgba(3, 8, 16, 0.30) 45%,
            rgba(3, 8, 16, 0.55) 100%
        ),
        linear-gradient(
            180deg,
            rgba(5, 15, 30, 0.25),
            rgba(3, 7, 14, 0.78)
        ),
        url("city-01.jpg") center / cover no-repeat;
    transition: background-image 0.7s ease;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(80, 200, 255, 0.04) 50%,
            transparent 100%
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 90px,
            rgba(150, 220, 255, 0.025) 91px
        );
    pointer-events: none;
}

/* =========================
   MAIN
========================= */

.lobby {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
}

/* =========================
   TOP TIME
========================= */

.time-panel {
    position: absolute;
    top: 3.5%;
    right: 4%;
    width: 39%;
    min-width: 230px;
    height: 7.5%;
    min-height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(72, 170, 255, 0.26),
            rgba(10, 20, 40, 0.78)
        );

    border: 1px solid var(--line);
    clip-path: polygon(
        3% 0,
        100% 0,
        97% 100%,
        0 100%
    );

    box-shadow:
        0 0 20px rgba(80, 190, 255, 0.12),
        inset 0 0 20px rgba(120, 220, 255, 0.06);

    z-index: 10;
}

.time-panel::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 100%;
    background: var(--cyan);
    box-shadow: 0 0 15px var(--cyan);
}

.time-label {
    position: absolute;
    top: -13px;
    left: 22px;

    padding: 1px 14px;

    font-size: 10px;
    letter-spacing: 3px;
    color: var(--cyan);

    background: #071321;
    border: 1px solid rgba(130, 230, 255, 0.4);
}

#clock {
    font-size: clamp(25px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: 5px;
    text-shadow: 0 0 12px rgba(130, 230, 255, 0.8);
}

/* =========================
   CHARACTER
========================= */

.character-area {
    position: absolute;
    left: 1%;
    bottom: 6%;
    width: 53%;
    height: 86%;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    z-index: 5;
    pointer-events: none;
}

.character {
    position: absolute;
    bottom: 0;
    left: 5%;

    height: 91%;
    max-width: 100%;

    object-fit: contain;
    object-position: bottom center;

    filter:
        drop-shadow(0 10px 20px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 14px rgba(100, 210, 255, 0.12));

    cursor: pointer;
    pointer-events: auto;

    transition:
        transform 0.35s ease,
        filter 0.35s ease;
}

.character:hover {
    transform: translateY(-7px);
    filter:
        drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6))
        drop-shadow(0 0 22px rgba(110, 220, 255, 0.3));
}

/* =========================
   SPEECH BUBBLE
========================= */

.speech {
    position: absolute;
    left: 50%;
    top: 7%;
    width: min(350px, 65vw);

    padding: 16px 20px;

    background:
        linear-gradient(
            135deg,
            rgba(15, 32, 55, 0.94),
            rgba(5, 12, 23, 0.92)
        );

    border: 1px solid rgba(130, 225, 255, 0.65);
    clip-path: polygon(
        0 0,
        96% 0,
        100% 18%,
        96% 100%,
        4% 100%,
        0 82%
    );

    box-shadow:
        0 0 25px rgba(80, 210, 255, 0.15),
        inset 0 0 20px rgba(120, 220, 255, 0.05);

    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;

    z-index: 20;
}

.speech.show {
    opacity: 1;
    transform: translateY(0);
}

.speech::before {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 35px;

    width: 20px;
    height: 20px;

    background: #091522;
    border-right: 1px solid rgba(130, 225, 255, 0.65);
    border-bottom: 1px solid rgba(130, 225, 255, 0.65);

    transform: rotate(45deg);
}

.speech-text {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
    color: #e9fbff;
}

/* =========================
   RIGHT UI
========================= */

.ui-right {
    position: absolute;
    right: 3.5%;
    top: 19%;
    width: 44%;
    height: 67%;

    z-index: 8;
}

/* Common panel */

.panel {
    position: absolute;

    background:
        linear-gradient(
            135deg,
            rgba(13, 29, 50, 0.80),
            rgba(4, 11, 21, 0.78)
        );

    border: 1px solid rgba(135, 222, 255, 0.45);

    box-shadow:
        0 0 20px rgba(40, 170, 255, 0.07),
        inset 0 0 25px rgba(80, 190, 255, 0.035);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    overflow: hidden;
}

.panel::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 5px,
            rgba(140, 225, 255, 0.012) 6px
        );

    pointer-events: none;
}

.panel-title {
    position: absolute;
    top: 0;
    left: 0;

    padding: 7px 18px;

    font-size: clamp(13px, 2vw, 19px);
    font-weight: 600;
    letter-spacing: 2px;

    color: #e8fbff;

    background:
        linear-gradient(
            90deg,
            rgba(80, 180, 255, 0.26),
            transparent
        );

    border-left: 4px solid var(--cyan);

    min-width: 45%;
}

.panel-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 1px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
}

/* =========================
   GAME HISTORY
========================= */

.game-panel {
    top: 0;
    right: 0;
    width: 60%;
    height: 28%;

    transform: skewX(-3deg);
}

/* =========================
   ABOUT ME
========================= */

.about-panel {
    right: 0;
    top: 34%;
    width: 60%;
    height: 28%;

    transform: skewX(-3deg);
}

/* =========================
   UPDATE
========================= */

.update-panel {
    left: 0;
    top: 5%;
    width: 34%;
    height: 62%;

    transform: skewY(2deg);
}

.update-content {
    position: absolute;
    inset: 58px 15px 15px;

    display: flex;
    flex-direction: column;
    gap: 9px;
}

.update-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 9px 8px;

    background: rgba(100, 190, 255, 0.055);
    border-left: 2px solid rgba(130, 220, 255, 0.35);

    font-size: 11px;
}

.status {
    padding: 2px 7px;

    font-size: 9px;
    letter-spacing: 1px;

    border: 1px solid currentColor;
}

.status.locked {
    color: #82909c;
}

.status.unlocked {
    color: #7fe8ff;
    text-shadow: 0 0 8px rgba(100, 220, 255, 0.7);
}

/* =========================
   START
========================= */

.start-button {
    position: absolute;

    right: 0;
    bottom: 7%;

    width: 58%;
    height: 13%;

    border: 1px solid rgba(145, 235, 255, 0.8);

    background:
        linear-gradient(
            100deg,
            rgba(50, 130, 210, 0.24),
            rgba(100, 220, 255, 0.12)
        );

    color: #e9fbff;

    font-family: inherit;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 600;
    letter-spacing: 8px;

    cursor: pointer;

    clip-path: polygon(
        4% 0,
        100% 0,
        94% 100%,
        0 100%
    );

    transition:
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}

.start-button::before {
    content: "";
    position: absolute;
    inset: 4px;

    border: 1px solid rgba(130, 225, 255, 0.15);
}

.start-button:hover {
    transform: translateX(-5px);

    background:
        linear-gradient(
            100deg,
            rgba(60, 170, 255, 0.42),
            rgba(120, 235, 255, 0.2)
        );

    box-shadow:
        0 0 25px rgba(90, 210, 255, 0.2);
}

.start-button:active {
    transform: translateX(-2px) scale(0.98);
}

/* =========================
   BOTTOM SETTINGS
========================= */

.settings {
    position: absolute;

    left: 50%;
    bottom: 7%;

    width: 34%;
    height: 6.5%;

    transform: translateX(-50%) skewX(-5deg);

    z-index: 12;
}

.settings button {
    width: 100%;
    height: 100%;

    border: 1px solid rgba(150, 220, 255, 0.45);

    background:
        linear-gradient(
            90deg,
            rgba(5, 13, 24, 0.9),
            rgba(20, 39, 61, 0.82)
        );

    color: #dff8ff;

    font-family: inherit;
    font-size: clamp(13px, 2vw, 18px);
    letter-spacing: 4px;

    cursor: pointer;

    transition: 0.25s ease;
}

.settings button:hover {
    color: white;

    background:
        linear-gradient(
            90deg,
            rgba(20, 65, 100, 0.9),
            rgba(20, 50, 80, 0.9)
        );

    box-shadow: 0 0 20px rgba(100, 220, 255, 0.18);
}

/* =========================
   CREDIT / INSTAGRAM
========================= */

.credit {
    position: absolute;

    left: 2.5%;
    right: 2.5%;
    bottom: 1.7%;

    height: 3.8%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            90deg,
            rgba(5, 20, 38, 0.92),
            rgba(17, 52, 82, 0.9),
            rgba(5, 20, 38, 0.92)
        );

    border-top: 1px solid rgba(120, 220, 255, 0.5);
    border-bottom: 1px solid rgba(120, 220, 255, 0.3);

    z-index: 15;
}

.credit a {
    color: #9eeaff;
    text-decoration: none;

    font-size: clamp(10px, 1.7vw, 14px);
    letter-spacing: 2px;

    transition: 0.25s ease;
}

.credit a:hover {
    color: white;
    text-shadow: 0 0 10px #80eaff;
}

/* =========================
   SETTINGS BACKGROUND MENU
========================= */

.background-menu {
    position: absolute;
    left: 50%;
    bottom: 14%;

    width: min(480px, 82vw);

    padding: 15px;

    transform: translate(-50%, 15px);

    display: flex;
    gap: 8px;

    background: rgba(5, 14, 25, 0.94);
    border: 1px solid rgba(120, 220, 255, 0.4);

    box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;

    z-index: 30;
}

.background-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

.bg-choice {
    flex: 1;
    height: 55px;

    border: 1px solid rgba(130, 220, 255, 0.35);

    cursor: pointer;

    background-size: cover;
    background-position: center;

    position: relative;
}

.bg-choice::after {
    content: attr(data-name);

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.38);

    color: white;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
}

.bg-choice:hover {
    border-color: var(--cyan);
}

/* =========================
   DECORATION
========================= */

.corner {
    position: absolute;
    width: 35px;
    height: 35px;
    border-color: rgba(120, 220, 255, 0.55);
    pointer-events: none;
}

.corner.top-left {
    left: 2%;
    top: 3%;
    border-left: 1px solid;
    border-top: 1px solid;
}

.corner.top-right {
    right: 2%;
    top: 3%;
    border-right: 1px solid;
    border-top: 1px solid;
}

.corner.bottom-left {
    left: 2%;
    bottom: 7%;
    border-left: 1px solid;
    border-bottom: 1px solid;
}

.corner.bottom-right {
    right: 2%;
    bottom: 7%;
    border-right: 1px solid;
    border-bottom: 1px solid;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .time-panel {
        top: 2.5%;
        right: 3%;
        width: 43%;
        min-width: 150px;
        height: 6%;
    }

    #clock {
        font-size: 20px;
        letter-spacing: 3px;
    }

    .character-area {
        left: -8%;
        bottom: 8%;
        width: 62%;
        height: 78%;
    }

    .character {
        left: -2%;
        height: 88%;
    }

    .speech {
        left: 35%;
        top: 2%;
        width: 180px;
        padding: 11px;
    }

    .speech-text {
        font-size: 11px;
    }

    .ui-right {
        right: 2%;
        top: 17%;
        width: 49%;
        height: 68%;
    }

    .game-panel {
        width: 78%;
        height: 24%;
    }

    .about-panel {
        width: 78%;
        height: 24%;
        top: 29%;
    }

    .update-panel {
        width: 42%;
        top: 4%;
        height: 55%;
    }

    .update-content {
        inset: 48px 8px 8px;
        gap: 5px;
    }

    .update-row {
        padding: 6px 5px;
        font-size: 8px;
    }

    .status {
        font-size: 7px;
        padding: 1px 4px;
    }

    .start-button {
        bottom: 6%;
        width: 72%;
        height: 10%;
        font-size: 17px;
        letter-spacing: 5px;
    }

    .settings {
        bottom: 8%;
        width: 38%;
        height: 5%;
    }

    .settings button {
        font-size: 11px;
        letter-spacing: 2px;
    }

    .credit {
        bottom: 1.5%;
        height: 3.5%;
    }

    .credit a {
        font-size: 9px;
        letter-spacing: 1px;
    }
}

@media (max-height: 700px) {

    .character {
        height: 88%;
    }

    .character-area {
        bottom: 8%;
    }

    .ui-right {
        top: 16%;
        height: 68%;
    }

    .speech {
        top: 0;
    }
}
</style>
</head>

<body>

<div class="background" id="background"></div>

<main class="lobby">

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- REAL-TIME CLOCK -->
    <section class="time-panel">
        <span class="time-label">TIME</span>
        <span id="clock">00:00:00</span>
    </section>

    <!-- CHARACTER -->
    <section class="character-area">

        <img
            src="character.png"
            alt="Character"
            class="character"
            id="character"
        >

        <div class="speech" id="speech">
            <div class="speech-text" id="speechText"></div>
        </div>

    </section>

    <!-- RIGHT UI -->
    <section class="ui-right">

        <!-- ประวัติเกม -->
        <div class="panel game-panel">
            <div class="panel-title">ประวัติเกม</div>
        </div>

        <!-- About Me -->
        <div class="panel about-panel">
            <div class="panel-title">About me</div>
        </div>

        <!-- Update -->
        <div class="panel update-panel">
            <div class="panel-title">Update</div>

            <div class="update-content">

                <div class="update-row">
                    <span>PROJECT</span>
                    <span class="status unlocked">UNLOCK</span>
                </div>

                <div class="update-row">
                    <span>UPDATE 01</span>
                    <span class="status locked">LOCKED</span>
                </div>

                <div class="update-row">
                    <span>UPDATE 02</span>
                    <span class="status locked">LOCKED</span>
                </div>

            </div>
        </div>

        <!-- START -->
        <button class="start-button" id="startButton">
            Start
        </button>

    </section>

    <!-- SETTINGS -->
    <div class="settings">
        <button id="settingsButton">
            Setting
        </button>
    </div>

    <!-- BACKGROUND SELECTOR -->
    <div class="background-menu" id="backgroundMenu">

        <button
            class="bg-choice"
            data-bg="city-01.jpg"
            data-name="CITY 01"
            style="background-image:url('city-01.jpg')">
        </button>

        <button
            class="bg-choice"
            data-bg="city-02.jpg"
            data-name="CITY 02"
            style="background-image:url('city-02.jpg')">
        </button>

        <button
            class="bg-choice"
            data-bg="city-03.jpg"
            data-name="CITY 03"
            style="background-image:url('city-03.jpg')">
        </button>

    </div>

    <!-- INSTAGRAM -->
    <footer class="credit">
        <a
            href="https://www.instagram.com/kllurself.ut/"
            target="_blank"
            rel="noopener noreferrer"
        >
            IG: kllurself.ut
        </a>
    </footer>

</main>

<script>

/* =========================
   REAL-TIME CLOCK
========================= */

function updateClock() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('clock').textContent =
        `${hours}:${minutes}:${seconds}`;
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   CHARACTER SPEECH
========================= */

const japaneseLines = [

    "こんにちは。今日も会えて嬉しいです。",
    "ようこそ。ゆっくりしていってください。",
    "一緒にゲームを始めませんか？",
    "準備はできていますか？",
    "今日も頑張りましょう。",
    "ここで少し休んでいきませんか？",
    "さあ、冒険を始めましょう。",
    "あなたを待っていました。"

];

const character = document.getElementById('character');
const speech = document.getElementById('speech');
const speechText = document.getElementById('speechText');

let speechTimer;

character.addEventListener('click', () => {

    const randomIndex =
        Math.floor(Math.random() * japaneseLines.length);

    speechText.textContent =
        japaneseLines[randomIndex];

    speech.classList.add('show');

    clearTimeout(speechTimer);

    speechTimer = setTimeout(() => {
        speech.classList.remove('show');
    }, 4200);

});


/* =========================
   SETTINGS
========================= */

const settingsButton =
    document.getElementById('settingsButton');

const backgroundMenu =
    document.getElementById('backgroundMenu');

const background =
    document.getElementById('background');

settingsButton.addEventListener('click', () => {

    backgroundMenu.classList.toggle('show');

});


/* =========================
   BACKGROUND SWITCH
========================= */

document.querySelectorAll('.bg-choice').forEach(button => {

    button.addEventListener('click', () => {

        const selectedBackground =
            button.dataset.bg;

        background.style.backgroundImage = `
            linear-gradient(
                90deg,
                rgba(3, 8, 16, 0.72) 0%,
                rgba(3, 8, 16, 0.30) 45%,
                rgba(3, 8, 16, 0.55) 100%
            ),
            linear-gradient(
                180deg,
                rgba(5, 15, 30, 0.25),
                rgba(3, 7, 14, 0.78)
            ),
            url("${selectedBackground}")
        `;

        backgroundMenu.classList.remove('show');

    });

});


/* =========================
   START
========================= */

document.getElementById('startButton')
    .addEventListener('click', () => {

        /*
            ยังไม่ใส่ระบบเกม
            ปุ่มพร้อมสำหรับเชื่อมหน้าเกมภายหลัง
        */

    });


/* =========================
   CLOSE SETTING
   WHEN CLICK OUTSIDE
========================= */

document.addEventListener('click', (event) => {

    if (
        !backgroundMenu.contains(event.target) &&
        event.target !== settingsButton
    ) {
        backgroundMenu.classList.remove('show');
    }

});

</script>

</body>
</html
