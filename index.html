<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Fantasy Lobby</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue-main: #38bdf8;
      --blue-light: #e0f2fe;
      --blue-pale: #f0f9ff;
      --white: #ffffff;
      --text-main: #0369a1;
      --text-dark: #0f172a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Quicksand", sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }

    /* =========================
       MAIN LOBBY (FULLSCREEN)
    ========================= */

    .lobby {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(240, 249, 255, 0.5),
          rgba(224, 242, 254, 0.85)
        ),
        url("city-background.jpg") center / cover no-repeat;

      isolation: isolate;
    }

    .lobby::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          circle at 15% 30%,
          rgba(255, 255, 255, 0.8),
          transparent 50%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(125, 211, 252, 0.3),
          transparent 50%
        );
      
      pointer-events: none;
    }

    /* =========================
       DECORATIVE UI CORNERS
    ========================= */

    .corner {
      position: absolute;
      width: 45px;
      height: 45px;
      border-color: rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 5;
    }

    .corner.top-left { top: 15px; left: 15px; border-top: 3px solid; border-left: 3px solid; border-radius: 8px 0 0 0; }
    .corner.top-right { top: 15px; right: 15px; border-top: 3px solid; border-right: 3px solid; border-radius: 0 8px 0 0; }
    .corner.bottom-left { bottom: 15px; left: 15px; border-bottom: 3px solid; border-left: 3px solid; border-radius: 0 0 0 8px; }
    .corner.bottom-right { bottom: 15px; right: 15px; border-bottom: 3px solid; border-right: 3px solid; border-radius: 0 0 8px 0; }

    /* =========================
       TOP CLOCK
    ========================= */

    .clock {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);

      min-width: 150px;
      padding: 8px 22px;
      text-align: center;

      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(125, 211, 252, 0.5);
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .clock span {
      display: block;
      font-family: "Orbitron", sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);
    }

    /* =========================
       MAIN UI PANELS
    ========================= */

    .ui {
      position: absolute;
      inset: 0;
      padding: 85px 20px 95px;
      pointer-events: none;
      z-index: 8;
    }

    .panel {
      pointer-events: auto;
      position: absolute;

      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(186, 230, 253, 0.9);
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.12);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .panel:hover {
      border-color: var(--blue-main);
      transform: translateY(-2px);
    }

    .panel-title {
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-main);
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* UPDATE PANEL */
    .update-panel {
      left: 20px;
      top: 125px;
      width: 150px;
      height: 195px;
      padding: 16px 14px;
    }

    .update-line {
      height: 1px;
      background: rgba(186, 230, 253, 0.8);
      margin: 10px 0;
    }

    .locked {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-dark);
      font-weight: 600;
    }

    .status {
      padding: 2px 6px;
      border: 1px solid rgba(125, 211, 252, 0.6);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 8px;
      letter-spacing: 1px;
      background: var(--blue-pale);
    }

    /* RIGHT PANELS */
    .game-panel {
      right: 20px;
      top: 125px;
      width: 155px;
      height: 115px;
      padding: 16px 14px;
    }

    .me-panel {
      right: 20px;
      top: 255px;
      width: 155px;
      height: 125px;
      padding: 16px 14px;
    }

    .empty {
      width: 100%;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed rgba(125, 211, 252, 0.5);
      border-radius: 8px;
      color: #0284c7;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(240, 249, 255, 0.5);
    }

    /* =========================
       CHARACTER & ANIMATION
    ========================= */

    .character-area {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      width: 220px;
      height: 360px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .character {
      width: 190px;
      height: 340px;
      
      background-image: url("https://i.ibb.co/1GzR17r0/image-6.png");
      
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;

      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      animation: floatChar 4s ease-in-out infinite;
    }

    .character:hover {
      transform: scale(1.03);
      filter: brightness(1.05);
    }

    @keyframes floatChar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* =========================
       SPEECH BUBBLE
    ========================= */

    .speech {
      position: absolute;
      left: 50%;
      bottom: 425px;
      width: 190px;
      padding: 12px 16px;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      visibility: hidden;

      background: rgba(255, 255, 255, 0.95);
      color: var(--text-dark);
      border: 1.5px solid rgba(125, 211, 252, 0.8);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);

      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    .speech.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .speech-text {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-main);
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 12px;
      height: 12px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(255, 255, 255, 0.95);
      border-right: 1.5px solid rgba(125, 211, 252, 0.8);
      border-bottom: 1.5px solid rgba(125, 211, 252, 0.8);
    }

    /* =========================
       BOTTOM MENU
    ========================= */

    .bottom-menu {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 15;
      width: 90%;
      max-width: 480px;
      justify-content: space-between;
    }

    .menu-button {
      flex: 1;
      height: 42px;
      padding: 0 6px;

      border: 1.5px solid rgba(186, 230, 253, 0.9);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);

      font-family: "Quicksand", sans-serif;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;

      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.1);
      transition: all 0.2s ease;
    }

    .menu-button:hover {
      background: var(--blue-pale);
      border-color: var(--blue-main);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    /* ปุ่ม START ขนาดใหญ่เด่นชัด */
    .menu-button.start {
      flex: 1.6;
      height: 48px;
      color: var(--white);
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      border: 2px solid var(--white);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
    }

    .menu-button.start:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.6);
      color: var(--white);
    }

    /* =========================
       INSTAGRAM CREDIT
    ========================= */

    .credit {
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      font-family: "Orbitron", sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-main);
      white-space: nowrap;
      z-index: 10;
      opacity: 0.85;
    }

    .credit a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
    }

    .credit a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="lobby">

    <!-- Decorative corners -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- REAL-TIME CLOCK -->
    <div class="clock">
      <span id="clock">00:00</span>
    </div>

    <section class="ui">
      <!-- UPDATE -->
      <div class="panel update-panel">
        <div class="panel-content">
          <div class="panel-title">UPDATE</div>
          <div class="update-line"></div>
          <div class="locked"><span>UPDATE 01</span><span class="status">LOCKED</span></div>
          <div class="update-line"></div>
          <div class="locked"><span>UPDATE 02</span><span class="status">LOCKED</span></div>
          <div class="update-line"></div>
          <div class="locked"><span>UPDATE 03</span><span class="status">LOCKED</span></div>
        </div>
      </div>

      <!-- ABOUT GAME -->
      <div class="panel game-panel">
        <div class="panel-content">
          <div class="panel-title">ABOUT GAME</div>
          <div class="empty">COMING SOON</div>
        </div>
      </div>

      <!-- ABOUT ME -->
      <div class="panel me-panel">
        <div class="panel-content">
          <div class="panel-title">ABOUT ME</div>
          <div class="empty">PROFILE</div>
        </div>
      </div>
    </section>

    <!-- CHARACTER -->
    <div class="character-area">
      <div class="character" id="character" title="Click me!"></div>
    </div>

    <!-- SPEECH -->
    <div class="speech" id="speech">
      <div class="speech-text" id="speechText"></div>
    </div>

    <!-- INSTAGRAM -->
    <div class="credit">
      <a href="https://www.instagram.com/kllurself.ut/" target="_blank" rel="noopener noreferrer">
        IG: kllurself.ut
      </a>
    </div>

    <!-- BOTTOM MENU -->
    <nav class="bottom-menu">
      <button class="menu-button">About me</button>
      <button class="menu-button">ประวัติเกม</button>
      <button class="menu-button start">START</button>
      <button class="menu-button">Update</button>
      <button class="menu-button">Setting</button>
    </nav>

  </main>

  <script>
    /* =========================
       REAL-TIME CLOCK
    ========================= */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* =========================
       CHARACTER SPEECH (JAPANESE)
    ========================= */
    const character = document.getElementById("character");
    const speech = document.getElementById("speech");
    const speechText = document.getElementById("speechText");

    const japaneseLines = [
      "こんにちは！",
      "一緒に遊ぼう？",
      "ようこそ！",
      "ゲームを始める？",
      "ここで待ってるね。",
      "今日も頑張ろう！"
    ];

    character.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * japaneseLines.length);
      speechText.textContent = japaneseLines[randomIndex];
      speech.classList.add("show");

      clearTimeout(window.speechTimer);
      window.speechTimer = setTimeout(() => {
        speech.classList.remove("show");
      }, 3000);
    });
  </script>

</body>
</html>
