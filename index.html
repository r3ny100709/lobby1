<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainy.Ren</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#ffe4ee; --bg2:#fff5f8; --bg3:#ffffff;
  --ink:#c2547a; --soft:#ffb8d0; --fur-line:#f3c4d4; --ear:#ffc1d6; --cheek:#ffa6c4; --fur:#ffffff;
  --card:rgba(255,255,255,.72);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#4a2a38; --bg2:#3b2330; --bg3:#2f1c27;
    --ink:#ffc1d6; --soft:#ff9fc0; --fur-line:#e8b4c8; --ear:#ff9fc0; --cheek:#ff8fb5; --fur:#fff5f8;
    --card:rgba(70,40,55,.7);
  }
}
:root[data-theme="dark"]{
  --bg1:#4a2a38; --bg2:#3b2330; --bg3:#2f1c27;
  --ink:#ffc1d6; --soft:#ff9fc0; --fur-line:#e8b4c8; --ear:#ff9fc0; --cheek:#ff8fb5; --fur:#fff5f8;
  --card:rgba(70,40,55,.7);
}
html,body{margin:0;min-height:100%}
body{
  overflow-x:hidden;
  background:url("IMG_7670.jpeg") center center / cover no-repeat fixed;
  font-family:'Mali','Sarabun','Noto Sans Thai',sans-serif;
  color:var(--ink);
}
#sky{position:fixed;inset:0;pointer-events:none}
.float{position:absolute;bottom:-40px;opacity:.75;animation:rise linear forwards;user-select:none}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.stage{position:relative;text-align:center;z-index:1;padding:20px 18px 40px;max-width:520px;margin:0 auto}
.bunnies{display:flex;align-items:flex-end;justify-content:center;padding:0 2%}
.bunny{margin:0 -2.5%;animation:bob 3s ease-in-out var(--d) infinite}
.bunny svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-8px)}}
.ear-l{transform-origin:78px 90px;animation:wig 3.6s ease-in-out var(--d) infinite}
.ear-r{transform-origin:122px 90px;animation:wig 3.6s ease-in-out var(--d) infinite reverse}
@keyframes wig{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-7deg)}94%{transform:rotate(5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s var(--d) infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
h1{margin:12px 0 4px;font-size:clamp(1.5rem,6vw,2.2rem);font-weight:700}
.menu{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.card{position:relative;background:var(--card);border:3px solid var(--soft);outline:3px dotted var(--fur-line);outline-offset:4px;border-radius:28px;padding:18px 20px;box-shadow:0 8px 20px rgba(255,150,190,.25);text-align:left;transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover,.card:active{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 26px rgba(255,150,190,.4)}
.card .tag{position:absolute;top:-16px;right:18px;font-size:26px;background:var(--bg2);border:3px solid var(--soft);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.card h2{margin:0;font-size:1.5rem;font-weight:700;color:var(--ink)}
  .card-link{
  display:block;
  text-decoration:none;
  color:inherit;
}
.card.game{padding:26px 22px;text-align:center}
.card.game h2{font-size:clamp(3rem,16vw,4.6rem);line-height:1;letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<main class="stage">
  <div class="bunnies" id="bunnies" aria-label="กระต่ายน่ารัก"></div>
  <h1>Rainy.Ren</h1>
  <div class="menu">
    <section class="card game"><span class="tag">🎮</span><h2>Game</h2></section>
    <section class="card"><span class="tag">🌷</span><h2>About me</h2></section>
    <a
  class="card card-link"
  href="https://r3ny100709.github.io/history/"
>
  <span class="tag">📖</span>
  <h2>History</h2>
</a>
    <section class="card"><span class="tag">⚙️</span><h2>Setting</h2></section>
  </div>
</main>
<script>
const bunnySVG=`<svg viewBox="0 0 200 230">
  <g class="ear-l"><ellipse cx="72" cy="48" rx="20" ry="52" fill="var(--fur)" stroke="var(--fur-line)" stroke-width="3"/><ellipse cx="72" cy="52" rx="10" ry="36" fill="var(--ear)"/></g>
  <g class="ear-r"><ellipse cx="128" cy="48" rx="20" ry="52" fill="var(--fur)" stroke="var(--fur-line)" stroke-width="3"/><ellipse cx="128" cy="52" rx="10" ry="36" fill="var(--ear)"/></g>
  <ellipse cx="100" cy="190" rx="52" ry="38" fill="var(--fur)" stroke="var(--fur-line)" stroke-width="3"/>
  <circle cx="150" cy="205" r="12" fill="var(--fur)" stroke="var(--fur-line)" stroke-width="3"/>
  <ellipse cx="100" cy="125" rx="58" ry="50" fill="var(--fur)" stroke="var(--fur-line)" stroke-width="3"/>
  <ellipse class="eye" cx="76" cy="122" rx="6" ry="8" fill="#5a3344"/>
  <ellipse class="eye" cx="124" cy="122" rx="6" ry="8" fill="#5a3344"/>
  <circle cx="78" cy="119" r="2" fill="#fff"/><circle cx="126" cy="119" r="2" fill="#fff"/>
  <ellipse cx="62" cy="140" rx="10" ry="6" fill="var(--cheek)" opacity=".6"/>
  <ellipse cx="138" cy="140" rx="10" ry="6" fill="var(--cheek)" opacity=".6"/>
  <path d="M94 136 q6 6 12 0 q-6 -4 -12 0z" fill="var(--cheek)"/>
  <path d="M100 140 v6 M100 146 q-7 7 -14 2 M100 146 q7 7 14 2" fill="none" stroke="#5a3344" stroke-width="2.5" stroke-linecap="round"/>
</svg>`;
const bunnies=document.getElementById('bunnies');
[[46,0]].forEach(([w,d])=>{
  const el=document.createElement('div');
  el.className='bunny';
  el.style.width=w+'%';
  el.style.setProperty('--d',d+'s');
  el.innerHTML=bunnySVG;
  bunnies.appendChild(el);
});
// ลอยหัวใจ/ดอกไม้เบา ๆ ทั้งหน้าจอ
const sky=document.getElementById('sky'),icons=['🌸','🤍','💗','🌷','✨'];
function spawn(){
  const el=document.createElement('span');
  el.className='float';
  el.textContent=icons[Math.floor(Math.random()*icons.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.fontSize=(14+Math.random()*20)+'px';
  el.style.animationDuration=(8+Math.random()*8)+'s';
  sky.appendChild(el);
  setTimeout(()=>el.remove(),17000);
}
setInterval(spawn,900);
for(let i=0;i<6;i++)setTimeout(spawn,i*200);
</script>
</body>
</html>
